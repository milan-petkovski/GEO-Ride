<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO Ride - Map Driving Experience</title>

    <!-- Preconnect for Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Rajdhani:wght@600;700&display=block"
        rel="stylesheet">
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">

    <!-- Three.js for 3D Vehicle -->
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <!-- Universal Multiplayer (MQTT Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Premium Loading Screen -->
    <div id="loading-overlay"
        style="position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 1;">
        <div class="loading-content">
            <div class="loading-logo">GEO <span>RIDE</span></div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- UI Overlay -->
    <div class="ui-container">
        <header>
            <div class="header-left">
                <div class="logo">GEO <span>Ride</span></div>
                <a href="https://milanwebportal.com" target="_blank" class="author-link">BY MILANWEBPORTAL.COM</a>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <button id="search-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                    <input type="text" id="location-search" placeholder="Search location...">
                </div>

                <div class="multiplayer-wrapper">
                    <button id="mp-btn" class="mp-main-btn" title="Multiplayer">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span class="beta-badge">BETA</span>
                    </button>

                    <div id="mp-dropdown" class="mp-dropdown">
                        <div class="mp-dropdown-header">
                            <span>MULTIPLAYER</span>
                            <div id="mp-status-dot" class="status-dot"></div>
                        </div>

                        <div class="mp-section">
                            <div class="id-row">
                                <div class="id-badge" id="my-peer-id" title="Your personal code">...</div>
                                <button id="copy-id-btn">COPY</button>
                            </div>
                        </div>

                        <div class="mp-section">
                            <input type="text" id="join-peer-id" placeholder="ENTER CODE TO JOIN">
                            <button id="join-mp-btn" type="button" class="primary-btn">CONNECT</button>
                            <button id="disconnect-mp-btn" class="danger-btn">DISCONNECT</button>
                        </div>

                        <div id="mp-players-list" class="mp-players-list"></div>
                    </div>
                </div>

                <a href="https://paypal.me/milanpetkovski1" target="_blank" class="coffee-btn" title="Buy me a coffee">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                </a>
            </div>
        </header>

        <div class="bottom-ui">
            <div class="copyright-notice">
                Copyright © 2026 <a href="https://milanwebportal.com" target="_blank">milanwebportal.com</a> Sva prava
                zadržana.
            </div>
            <div class="speed-container">
                <div id="speed">0</div>
                <span id="unit-label">KM/H</span>
            </div>

            <div class="center-controls">
                <div class="control-item">
                    <div class="key-group">
                        <kbd>W</kbd>
                        <kbd>A</kbd>
                        <kbd>S</kbd>
                        <kbd>D</kbd>
                    </div>
                    <span>DRIVE</span>
                </div>
                <div class="divider"></div>
                <div class="control-item">
                    <kbd>R</kbd>
                    <div style="display: flex; flex-direction: column; line-height: 1.1;">
                        <span style="font-size: 0.9rem;">RESET</span>
                        <span style="font-size: 0.5rem; opacity: 0.3; letter-spacing: 1px;">+SHIFT GLOBAL</span>
                    </div>
                </div>
                <div class="divider"></div>
                <div class="control-item">
                    <kbd>SPACE</kbd>
                    <span>DRIFT</span>
                </div>
            </div>

            <div class="settings-wrapper">
                <div id="settings-panel" class="settings-panel">
                    <div class="settings-section">
                        <label>VEHICLE</label>
                        <div class="toggle-group vehicle-toggle">
                            <button class="active" data-vehicle="car">CAR</button>
                            <button data-vehicle="bus">BUS</button>
                            <button data-vehicle="truck">TRUCK</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <label>MAP STYLE</label>
                        <div class="toggle-group style-toggle">
                            <button class="active" data-style="streets-v12">STREETS</button>
                            <button data-style="satellite-v9">SATELLITE</button>
                            <button data-style="satellite-streets-v12">HYBRID</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <label>UNITS</label>
                        <div class="toggle-group unit-toggle">
                            <button class="active" data-unit="km">KM/H</button>
                            <button data-unit="mi">MPH</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <label>COLLISIONS</label>
                        <div class="toggle-group collision-toggle">
                            <button class="active" data-collision="on">ON</button>
                            <button data-collision="off">OFF</button>
                        </div>
                    </div>
                    <div class="settings-row">
                        <div class="settings-section">
                            <label>3D VEHICLES</label>
                            <div class="toggle-group d3v-toggle">
                                <button class="active" data-d3v="on">ON</button>
                                <button data-d3v="off">OFF</button>
                            </div>
                        </div>
                        <div class="settings-section">
                            <label>3D BUILDINGS</label>
                            <div class="toggle-group d3b-toggle">
                                <button class="active" data-d3b="on">ON</button>
                                <button data-d3b="off">OFF</button>
                            </div>
                        </div>
                    </div>
                    <div class="settings-section">
                        <label style="color: #FF00E5; text-shadow: 0 0 10px #FF00E5;">GOD MODE</label>
                        <div class="toggle-group god-toggle">
                            <button class="active" data-god="off">OFF</button>
                            <button data-god="on" style="--glow: #FF00E5;">ON</button>
                        </div>
                    </div>
                </div>
                <button id="settings-btn" class="settings-main-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z">
                        </path>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    <span>SETTINGS</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
